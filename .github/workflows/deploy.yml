# Exports the Shiny app with Shinylive and publishes it on GitHub Pages.
# In the repo: Settings -> Pages -> Build and deployment -> Source: GitHub Actions
# Generated - master: C:\deploy\sitecontrol\shiny\shared\.github\workflows\deploy.yml
name: Build and Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    outputs:
      # one artifact name per run attempt: a re-run would otherwise leave two artifacts
      # called github-pages in the run, and deploy-pages refuses to choose
      artifact: github-pages-${{ github.run_attempt }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install the build tools
        run: python -m pip install -r requirements.txt
      - name: Export the app with Shinylive
        run: shinylive export app site
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          name: github-pages-${{ github.run_attempt }}
          path: ./site

  deploy:
    needs: build
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-24.04
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
        with:
          # from the build job, so "Re-run failed jobs" (deploy only) still finds it
          artifact_name: ${{ needs.build.outputs.artifact }}
